[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-client"
version = "0.2.0"
description = "A Production-grade FastAPI client for interacting with the blockchain"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "web3>=6.15.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 88
target-version = "py313"
lint.select = ["E", "F", "I"] # PEP8 errors, pyflakes, isort

[tool.mypy]
strict = true
ignore_missing_imports = true
